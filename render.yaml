services:
  # PostgreSQL Database
  - type: pserv
    name: rehabit-postgres
    env: postgresql
    plan: free
    ipAllowList: []

  # Backend API
  - type: web
    name: rehabit-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://rehabit-frontend.onrender.com
      - key: DATABASE_URL
        fromService:
          name: rehabit-postgres
          type: pserv
          property: connectionString

  # Frontend React App
  - type: web
    name: rehabit-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s build -l $PORT
    envVars:
      - key: REACT_APP_API_URL
        value: https://rehabit-backend.onrender.com 